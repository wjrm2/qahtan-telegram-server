name: Run Qahtan bot

on:
  workflow_dispatch:

concurrency:
  group: qahtan-telegram-bot
  cancel-in-progress: true

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      AI_PROVIDER: ${{ vars.AI_PROVIDER || 'deepseek' }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-chat' }}
      DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL || 'https://api.deepseek.com' }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'openrouter/auto' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1-mini' }}
      OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL || 'qwen2.5:3b' }}
      OLLAMA_BASE_URL: http://127.0.0.1:11434/v1
      AI_TIMEOUT_SECONDS: "20"
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
      DEVELOPER_IDS: ${{ secrets.DEVELOPER_IDS }}
      DEVELOPER_MODE_CODE: ${{ secrets.DEVELOPER_MODE_CODE }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      EMAIL_USER: ${{ secrets.EMAIL_USER }}
      EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
      BOT_PORT: "8080"
      NODE_SERVER_PORT: "3000"
      NODE_SERVER_URL: http://127.0.0.1:3000
      AZ_AGENT_URL: http://127.0.0.1:8787
      AZ_AGENT_TOKEN: ${{ secrets.AZ_AGENT_TOKEN }}
      NODE_ENV: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: node_server/package-lock.json

      - name: Install Ollama
        if: ${{ vars.AI_PROVIDER == 'ollama' }}
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama and pull local model
        if: ${{ vars.AI_PROVIDER == 'ollama' }}
        run: |
          nohup ollama serve > ollama.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:11434/api/tags && break || sleep 1; done
          ollama pull qwen2.5:3b

      - name: Checkout az agent
        uses: actions/checkout@v4
        with:
          repository: wjrm2/az-
          path: az-agent

      - name: Create ephemeral az agent token
        run: echo "AZ_AGENT_TOKEN=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Setup az agent
        run: |
          python -m pip install -r az-agent/requirements.txt
          nohup python az-agent/agent_server.py > az-agent.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:8787/health && break || sleep 1; done

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          npm ci --prefix node_server

      - name: Start bot and server
        run: python run_all.py
