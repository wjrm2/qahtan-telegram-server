name: Run Qahtan bot

on:
  workflow_dispatch:

concurrency:
  group: qahtan-telegram-bot
  cancel-in-progress: true

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      AI_PROVIDER: ${{ vars.AI_PROVIDER || 'deepseek' }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-chat' }}
      DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL || 'https://api.deepseek.com' }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
      DEVELOPER_IDS: ${{ secrets.DEVELOPER_IDS }}
      DEVELOPER_MODE_CODE: ${{ secrets.DEVELOPER_MODE_CODE }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      EMAIL_USER: ${{ secrets.EMAIL_USER }}
      EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
      BOT_PORT: "8080"
      NODE_SERVER_PORT: "3000"
      NODE_SERVER_URL: http://127.0.0.1:3000
      NODE_ENV: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: node_server/package-lock.json

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          npm ci --prefix node_server

      - name: Start bot and server
        run: python run_all.py
